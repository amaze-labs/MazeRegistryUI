name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing in this workflow writes to the repository.
permissions:
  contents: read

# A new push to the same branch/PR cancels the run it superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # Caches the module and build caches keyed on go.sum.
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted" | sed 's/^/  /'
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build image (multi-arch); on main, publish and tag it
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write   # push the release tag (main only)
      packages: write   # push to ghcr.io (main only)
    env:
      IMAGE: ghcr.io/amaze-labs/mazeregistryui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and full history: the version decision needs both

      - name: Decide the version
        id: version
        if: github.event_name == 'push'
        run: ./.github/scripts/next-version.sh >> "$GITHUB_OUTPUT"

      # QEMU is only needed for the distroless runtime layer of the non-native
      # platform; the Go compile itself cross-compiles natively (see Dockerfile).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.version.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build date
        id: meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Pull requests (and re-runs with nothing new) build without pushing.
      - name: Build, and push on release
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.version.outputs.skip == 'false' }}
          tags: ${{ steps.version.outputs.skip == 'false' && format('{0}:{1},{0}:latest', env.IMAGE, steps.version.outputs.version) || 'mazeregistryui:ci' }}
          build-args: |
            VERSION=${{ steps.version.outputs.version || github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, once the image exists: a pushed tag is public and permanent, and
      # with the tag already on HEAD a re-run finds nothing to release.
      - name: Tag the release
        if: steps.version.outputs.skip == 'false'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Summary
        if: steps.version.outputs.skip == 'false'
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${IMAGE}:${{ steps.version.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
